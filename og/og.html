<!doctype html>
<html><head><meta charset="utf-8">
<!-- Source for public/og.png. Re-render with og/render.sh after changing it,
     then bump OG_VERSION in app/layout.jsx. Mirrors the home page question. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,700;1,600&family=IBM+Plex+Sans:wght@500&family=IBM+Plex+Mono:wght@500&display=block">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0A1110}
  .card{position:relative;width:1200px;height:630px;box-sizing:border-box;padding:60px 76px;
    display:flex;flex-direction:column;justify-content:space-between;
    background:radial-gradient(ellipse 70% 90% at 100% 100%,#13241F 0%,#0A1110 65%)}
  .brand{display:flex;align-items:center;gap:14px;font:700 30px/1 "Spectral",Georgia,serif;color:#ECF1EE;letter-spacing:-.01em}
  .mark{display:flex;flex-direction:column;gap:5px}
  .mark i{display:block;width:30px;height:4px;border-radius:2px;background:#D9AB4F}
  .mark i:nth-child(2){background:#74BAAE} .mark i:nth-child(3){background:#3F6E67}
  h1{margin:0;font:700 96px/.98 "Spectral",Georgia,serif;letter-spacing:-.035em;color:#ECF1EE;max-width:1000px}
  h1 .q{color:#D9AB4F}
  .follow{margin:26px 0 0;font:italic 600 38px/1.25 "Spectral",Georgia,serif;color:#A0ADA8;max-width:none;white-space:nowrap}
  .foot{display:flex;align-items:center;gap:16px}
  .tag{font:500 15px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#D9AB4F;
    border:1.5px solid #8D7033;background:#221D11;border-radius:4px;padding:9px 12px}
</style></head>
<body><div class="card">
  <div class="brand"><span class="mark"><i></i><i></i><i></i></span>Legacy Ladder</div>
  <div>
    <h1>Where is the crypto you earned ten years&nbsp;ago<span class="q">?</span></h1>
    <p class="follow">And how much of this year&rsquo;s will still be yours in ten years?</p>
  </div>
  <div class="foot"><span class="tag">Pre-launch</span></div>
</div></body></html>
