# Legacy Ladder contracts. Everything here is pinned so that any contributor,
# auditor or CI run compiles byte-for-byte the same code.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# Tests may only write their own coverage notes, nowhere else.
fs_permissions = [{ access = "read-write", path = "./cache/coverage" }]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 10000

[profile.default.invariant]
runs = 256
depth = 128
# Handlers catch every expected vault revert, so anything else is a failure.
fail_on_revert = true

# Heavier settings for CI and pre-audit runs.
[profile.ci.fuzz]
runs = 100000

[profile.ci.invariant]
runs = 2048
depth = 256

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
bsc_testnet = "${BSC_TESTNET_RPC_URL}"

[fmt]
line_length = 110
