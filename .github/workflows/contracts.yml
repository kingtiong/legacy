name: contracts

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *" # nightly: heavy fuzzing, and catch BNB Chain changing StakeHub behaviour

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: forge fmt --check
      - run: forge build --sizes
      - name: Unit, regression and invariant tests
        run: forge test --no-match-path "test/fork/*"
      - name: Mainnet fork tests
        # Public BNB Chain RPCs rate-limit cloud runners and prune state within about a minute, so a slow test can lose
        # its forked block ("missing trie node"). One suite at a time, throttled, with retries; then tests that failed
        # are re-run (each on a fresh block), up to twice. A real failure fails every attempt and fails the job.
        # Set a BSC_RPC_URL repository secret for a dedicated archive endpoint.
        shell: bash
        run: |
          set -o pipefail
          flags=(--match-path "test/fork/*" --threads 1 --rpc-url "$BSC_RPC_URL"
            --fork-retries 8 --fork-retry-backoff 3000 --compute-units-per-second 60)
          status=0
          forge test "${flags[@]}" 2>&1 | tee fork.log || status=$?
          for attempt in 1 2; do
            [ "$status" -eq 0 ] && break
            echo "::warning title=fork test::attempt $attempt: re-running failed fork tests on a fresh block"
            sleep 20
            status=0
            forge test "${flags[@]}" --rerun 2>&1 | tee fork.log || status=$?
          done
          if [ "$status" -ne 0 ]; then
            # Surface the cause as annotations (max 10), readable without opening the log.
            { grep -E "\[FAIL|[Ee]rror|timed out|429|403|revert" fork.log || tail -n 10 fork.log; } | head -n 10 |
              while IFS= read -r line; do echo "::error title=fork test::${line:0:900}"; done
          fi
          exit "$status"
        env:
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL || 'https://bsc-dataseed.bnbchain.org' }}

  heavy-fuzzing:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Invariants at 2,048 runs x 256 depth
        run: FOUNDRY_PROFILE=ci forge test --match-path "test/invariant/*"
