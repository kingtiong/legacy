name: contracts

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *" # nightly: heavy fuzzing, and catch BNB Chain changing StakeHub behaviour

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: forge fmt --check
      - run: forge build --sizes
      - name: Unit, regression and invariant tests
        run: forge test --no-match-path "test/fork/*"
      - name: Mainnet fork tests
        # The fast public BNB Chain RPC prunes state within about a minute, and call-heavy tests can lose their forked
        # block on a slow runner ("missing trie node"). So: one pass there, then any failed tests re-run against an
        # archive RPC, which keeps old state but is slow. A real failure fails on the archive RPC too, and fails the job.
        # Set BSC_RPC_URL / BSC_ARCHIVE_RPC_URL repository secrets for dedicated endpoints.
        timeout-minutes: 60
        shell: bash
        run: |
          set -o pipefail
          flags=(--match-path "test/fork/*" --threads 1 --fork-retries 8 --fork-retry-backoff 3000)
          status=0
          BSC_RPC_URL="$FAST_RPC" forge test "${flags[@]}" --rpc-url "$FAST_RPC" --compute-units-per-second 60 \
            2>&1 | tee fork.log || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning title=fork test::re-running failed fork tests against the archive RPC"
            status=0
            BSC_RPC_URL="$ARCHIVE_RPC" forge test "${flags[@]}" --rpc-url "$ARCHIVE_RPC" --compute-units-per-second 60 \
              --rerun 2>&1 | tee fork.log || status=$?
          fi
          if [ "$status" -ne 0 ]; then
            # Surface the cause as annotations (max 10), readable without opening the log.
            { grep -E "\[FAIL|[Ee]rror|timed out|429|403|revert" fork.log || tail -n 10 fork.log; } | head -n 10 |
              while IFS= read -r line; do echo "::error title=fork test::${line:0:900}"; done
          fi
          exit "$status"
        env:
          FAST_RPC: ${{ secrets.BSC_RPC_URL || 'https://bsc-dataseed.bnbchain.org' }}
          ARCHIVE_RPC: ${{ secrets.BSC_ARCHIVE_RPC_URL || 'https://api.zan.top/bsc-mainnet' }}

  heavy-fuzzing:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Invariants at 2,048 runs x 256 depth
        run: FOUNDRY_PROFILE=ci forge test --match-path "test/invariant/*"
