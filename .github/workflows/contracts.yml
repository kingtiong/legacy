name: contracts

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *" # nightly: heavy fuzzing, and catch BNB Chain changing StakeHub behaviour

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: forge fmt --check
      - run: forge build --sizes
      - name: Unit, regression and invariant tests
        run: forge test --no-match-path "test/fork/*"
      - name: Mainnet fork tests
        run: forge test --match-path "test/fork/*"
        env:
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL || 'https://bsc-dataseed.bnbchain.org' }}

  heavy-fuzzing:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Invariants at 2,048 runs x 256 depth
        run: FOUNDRY_PROFILE=ci forge test --match-path "test/invariant/*"
