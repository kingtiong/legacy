name: contracts

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *" # nightly: heavy fuzzing, and catch BNB Chain changing StakeHub behaviour

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: forge fmt --check
      - run: forge build --sizes
      - name: Unit, regression and invariant tests
        run: forge test --no-match-path "test/fork/*"
      - name: Mainnet fork tests
        # Public BNB Chain RPCs rate-limit cloud runners: one suite at a time, throttled, with retries.
        # Set a BSC_RPC_URL repository secret for a dedicated endpoint.
        shell: bash
        run: |
          set -o pipefail
          status=0
          forge test --match-path "test/fork/*" --threads 1 --rpc-url "$BSC_RPC_URL" \
            --fork-retries 8 --fork-retry-backoff 3000 --compute-units-per-second 60 2>&1 | tee fork.log || status=$?
          # Surface failures as annotations, readable without opening the log.
          grep -E "\[FAIL|Error|error code|HTTP error|rate limit|429|403" fork.log | head -15 | while IFS= read -r line; do
            echo "::error title=fork test::${line:0:900}"
          done
          exit $status
        env:
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL || 'https://bsc-dataseed.bnbchain.org' }}

  heavy-fuzzing:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Invariants at 2,048 runs x 256 depth
        run: FOUNDRY_PROFILE=ci forge test --match-path "test/invariant/*"
